<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#2a1a6e"/>
      <stop offset="0.45" stop-color="#121a4a"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbc3ff"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2670"/>
      <stop offset="0.5" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!--BG-->
  <rect id="bg" width="512" height="512" rx="112" fill="url(#sky)"/>
  <!--ART-->
  <g id="art">
    <circle cx="256" cy="262" r="226" fill="url(#rim)"/>
    <clipPath id="face"><circle cx="256" cy="262" r="186"/></clipPath>
    <circle cx="256" cy="262" r="186" fill="#0a1030"/>
    <image href="data:image/webp;base64," x="70" y="76" width="372" height="372" preserveAspectRatio="xMidYMid slice" clip-path="url(#face)"/>
    <circle cx="256" cy="262" r="186" fill="none" stroke="#38f0ff" stroke-width="14"/>
    <path d="M410 40 Q414 76 450 80 Q414 84 410 120 Q406 84 370 80 Q406 76 410 40Z" fill="#b6ff3b"/>
  </g>
</svg>
